          - type: 'null'
        precision:
          type: string
          enum:
          - day
          - month
          - year
          - unknown
        kind:
          type: string
          enum:
          - source_reported
          - estimated
          - actual
          - unknown
      required:
      - value
      - precision
      - kind
      additionalProperties: false
      allOf:
      - if:
          properties:
            precision:
              const: day
        then:
          properties:
            value:
              type: string
              pattern: ^\d{4}-\d{2}-\d{2}$
      - if:
          properties:
            precision:
              const: month
        then:
          properties:
            value:
              type: string
              pattern: ^\d{4}-\d{2}$
      - if:
          properties:
            precision:
              const: year
        then:
          properties:
            value:
              type: string
              pattern: ^\d{4}$
      - if:
          properties:
            precision:
              const: unknown
        then:
          properties:
            value:
